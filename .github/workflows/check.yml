# check.sh, uruchamiane przy kazdym push i pull requescie.
#
# Ten sam skrypt, ktory uruchamia sie lokalnie przed wypchnieciem - zeby
# "zapomnialem uruchomic check.sh" przestalo byc mozliwym stanem repozytorium.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Zadne z tych dwoch nie jest zalezoscia modulu, obu uzywa tylko kontrola.
      # Handlebars daje prawdziwa kompilacje szablonow zamiast liczenia blokow,
      # jsdom - prawdziwy DOM dla testow cudzego markupu. Awaria rejestru npm
      # nie moze zatrzymac calej kontroli: bez handlebars check.sh schodzi do
      # wersji bez kompilatora, bez jsdom testy markupu koncza sie pominieciem.
      # Cena jest taka, ze wtedy CI sprawdza mniej, nie mniej dokladnie.
      - name: handlebars i jsdom (opcjonalne)
        continue-on-error: true
        run: npm install --no-save --no-audit --no-fund handlebars jsdom

      - run: ./check.sh
