# check.sh, uruchamiane przy kazdym push i pull requescie.
#
# Ten sam skrypt, ktory uruchamia sie lokalnie przed wypchnieciem - zeby
# "zapomnialem uruchomic check.sh" przestalo byc mozliwym stanem repozytorium.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Zadne z tych dwoch nie jest zalezoscia modulu, obu uzywa tylko kontrola.
      # Handlebars daje prawdziwa kompilacje szablonow zamiast liczenia blokow,
      # jsdom - prawdziwy DOM dla testow cudzego markupu.
      #
      # continue-on-error jest tu po to, zeby awaria rejestru npm dala czytelny
      # blad w nastepnym kroku ("brak jsdom, a PK5E_TESTS_REQUIRE_DEPS jest
      # ustawione") zamiast szorstkiego bledu npm. Przebieg i tak bedzie
      # czerwony - patrz zmienna nizej. Lokalnie, bez tej zmiennej, brak
      # ktoregokolwiek z nich jest dopuszczalny i konczy sie pominieciem.
      - name: handlebars i jsdom (opcjonalne)
        continue-on-error: true
        run: npm install --no-save --no-audit --no-fund handlebars jsdom

      # Zaleznosci sa tu instalowane, wiec ich brak to awaria instalacji,
      # a nie srodowisko bez nich. Bez tego zielony przebieg moglby oznaczac,
      # ze polowa kontroli po cichu sie nie odbyla.
      - run: ./check.sh
        env:
          PK5E_TESTS_REQUIRE_DEPS: "1"
